# SPDX-License-Identifier: GPL-3.0-or-later
#
# Delivery: a tag on main becomes a release with the packages built from it.
#
# The tag is the only trigger, and it is checked before anything is built: a tag
# that does not sit on a merge commit of main, or that names a version missing
# from CHANGELOG.md, stops the job instead of shipping a package that lies about
# what it contains.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # gh workflow run necesita esto: sin él, el pedido al repositorio da 403
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guarda:
    name: guarda del tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: el tag es un merge de main y la versión está en el changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${TAG#v}"
          git fetch --no-tags origin main

          # 1) El commit del tag tiene que estar en main.
          if ! git merge-base --is-ancestor "${TAG}^{commit}" origin/main; then
            echo "el tag ${TAG} no está en main: no se publica." >&2
            exit 1
          fi

          # 2) Y tiene que ser el merge que trajo los cambios, no un commit suelto.
          padres="$(git rev-list --parents -n 1 "${TAG}^{commit}" | wc -w)"
          if [ "${padres}" -ne 3 ]; then
            echo "el commit de ${TAG} no es un merge commit (padres: $((padres - 1)))." >&2
            echo "el tag va sobre el merge del pull request a main." >&2
            exit 1
          fi

          # 3) La versión tiene que estar escrita en el changelog.
          if ! grep -qE "^## \[${version}\]" CHANGELOG.md; then
            echo "CHANGELOG.md no tiene una sección para ${version}." >&2
            exit 1
          fi
          echo "tag ${TAG}: merge de main con sección en el changelog"

  entrega:
    name: entrega
    needs: guarda
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
      - name: las pruebas pasan antes de empaquetar
        run: |
          go test ./...
          tools/hooks/spdx.sh
          tools/hooks/permisos.sh
      - name: las notas salen del changelog
        env:
          TAG: ${{ github.ref_name }}
        # Fuera del árbol de trabajo: goreleaser se niega a construir con
        # archivos sin versionar, y el cuerpo de la release no entra al repo.
        run: |
          {
            tools/changelog.sh notes "${TAG#v}"
            echo
            echo "---"
            echo
            echo "Paquetes \`.deb\` y \`.rpm\` para amd64 y arm64, más los binarios sueltos en tar.gz sin cgo."
            echo "Verificación: \`sha256sum -c checksums.txt\`"
            echo
            echo "El paquete instala el binario en \`/usr/bin\`, el acceso de menú, los iconos y la unidad"
            echo "de usuario; la configuración es tuya, en \`~/.config/ntfy-desktop/config.toml\`."
          } > "${RUNNER_TEMP}/release-notes.md"
      - name: construir y publicar
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: el cuerpo de la release
        # goreleaser ignora --release-notes en esta versión, así que el cuerpo se
        # escribe después, con el mismo archivo: si no se aplicara, el paso falla.
        run: gh release edit "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/release-notes.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: el repositorio de paquetes
        # Un release creado con GITHUB_TOKEN no dispara el evento `release`, así
        # que el repositorio se pide por nombre. Sin esto, los .deb quedan en la
        # release pero `apt` no los ve.
        run: gh workflow run repository.yml --ref main -f tag="${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: resumen
        run: |
          {
            echo "### ${GITHUB_REF_NAME}"
            echo
            gh release view "${GITHUB_REF_NAME}" --json assets \
              --template '{{range .assets}}- `{{.name}}` — {{.size}} bytes{{"\n"}}{{end}}'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
