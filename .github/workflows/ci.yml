# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  pull_request:
    branches: [main, devs]
  push:
    branches: [main, devs]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: calidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
      - name: gofmt
        run: |
          fuera="$(gofmt -l .)"
          if [ -n "${fuera}" ]; then echo "${fuera}"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: cabecera SPDX
        run: tools/hooks/spdx.sh
      - name: permisos
        run: tools/hooks/permisos.sh
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: firmas en los commits
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          tools/hooks/dco.sh "origin/${{ github.base_ref }}"

  build:
    name: build ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
      - name: compilar sin cgo
        run: CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build -trimpath -o /dev/null ./cmd/ntfy-desktop

  secretos:
    name: secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Se instala el binario en vez de usar gitleaks-action: la acción calcula un rango
      # "primer_commit^..ultimo" que falla en el push inicial, donde el primer commit no
      # tiene padre. Escanear el historial completo evita esa clase de error.
      # Actualizar la versión junto con las demás herramientas del proyecto.
      - name: instalar gitleaks
        run: |
          VER=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version
      - name: escanear el historial
        run: '"${RUNNER_TEMP}/gitleaks" detect --redact --verbose --no-banner --source .'
